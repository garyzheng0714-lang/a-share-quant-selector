name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirements.in
            requirements.lock
            requirements-dev.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --require-hashes -r requirements-dev.lock
      - name: Lint backend and tests
        run: ruff check main.py worker.py web_server.py utils views strategy tools tests
      - name: Check backend formatting
        run: ruff format --check main.py worker.py web_server.py utils views strategy tools tests
      - name: Type-check contracts
        run: >-
          mypy --follow-imports=skip
          utils/api_security.py utils/artifact_integrity.py utils/data_contracts.py
          utils/decision_ledger.py
          utils/market_snapshot.py utils/operations_store.py utils/runtime_schema.py
          utils/task_submission.py utils/probability_model.py
          tools/hierarchical_walk_forward.py tools/migration_dry_run.py
      - name: Backend tests and coverage gate
        run: >-
          python -m pytest -q
          --cov=utils.api_security --cov=utils.artifact_integrity
          --cov=utils.csv_manager --cov=utils.data_contracts
          --cov=utils.data_freshness --cov=utils.decision_ledger
          --cov=utils.execution_model --cov=utils.market_snapshot
          --cov=utils.operations_store --cov=utils.paper_trading
          --cov=utils.probability_model --cov=utils.reference_snapshots
          --cov=utils.runtime_schema
          --cov-report=term-missing --cov-fail-under=75

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.17.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm audit --audit-level=high

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"
      - name: Install security tools from lock
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Dependency audit
        run: |
          pip-audit --disable-pip --require-hashes -r requirements.lock
          pip-audit --disable-pip --require-hashes -r requirements-dev.lock
      - name: Python static security scan
        run: bandit -q -r main.py web_server.py worker.py utils views tools -lll
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

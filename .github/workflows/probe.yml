name: Probe data sources
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: |
          python - <<'PY'
          import time
          from utils import fetch
          t=time.time(); names, caps = fetch.fetch_universe(); print("universe", len(names), len(caps), round(time.time()-t,1),"s")
          for c in ["600519","000001","300750"]:
              t=time.time(); df=fetch.fetch_history(c, years=3); print("history",c,len(df), round(time.time()-t,1),"s")
              t=time.time(); df=fetch.fetch_recent(c); print("recent",c,len(df), round(time.time()-t,1),"s")
          t=time.time(); ind=fetch.fetch_industries(); print("industries", len(ind), round(time.time()-t,1),"s")
          PY

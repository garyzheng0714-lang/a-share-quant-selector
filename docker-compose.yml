services:
  web:
    image: ${QUANT_IMAGE:-a-share-quant:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18321:5000"
    volumes:
      - quant-data:/app/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3

  updater:
    image: ${QUANT_IMAGE:-a-share-quant:latest}
    restart: unless-stopped
    command: ["python", "updater.py", "--loop"]
    volumes:
      - quant-data:/app/data
    environment:
      QUANT_SCAN_WORKERS: "1"
      QUANT_FETCH_WORKERS: "2"
      QUANT_RUN_AT: "15:35"
    mem_limit: 512m

volumes:
  quant-data:
